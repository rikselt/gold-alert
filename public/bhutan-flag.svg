<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Orange upper-left triangle -->
  <polygon points="0,0 900,0 900,600" fill="#FF8000"/>
  <!-- Crimson lower-right triangle -->
  <polygon points="0,0 0,600 900,600" fill="#CF2027"/>
  <!-- White dragon (simplified) -->
  <g transform="translate(450,300)" fill="white">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="120" ry="60" opacity="0.95"/>
    <!-- Head -->
    <circle cx="110" cy="-30" r="45" opacity="0.95"/>
    <!-- Snout -->
    <ellipse cx="148" cy="-20" rx="25" ry="18" opacity="0.95"/>
    <!-- Tail -->
    <ellipse cx="-130" cy="20" rx="50" ry="25" transform="rotate(-20,-130,20)" opacity="0.95"/>
    <ellipse cx="-170" cy="40" rx="30" ry="15" transform="rotate(-35,-170,40)" opacity="0.95"/>
    <!-- Wings -->
    <ellipse cx="20" cy="-90" rx="35" ry="70" transform="rotate(-20,20,-90)" opacity="0.95"/>
    <ellipse cx="-20" cy="-85" rx="30" ry="60" transform="rotate(20,-20,-85)" opacity="0.95"/>
    <!-- Front legs -->
    <ellipse cx="60" cy="55" rx="18" ry="40" transform="rotate(20,60,55)" opacity="0.95"/>
    <ellipse cx="-20" cy="65" rx="18" ry="40" transform="rotate(-10,-20,65)" opacity="0.95"/>
    <!-- Claws -->
    <ellipse cx="75" cy="90" rx="8" ry="14" transform="rotate(30,75,90)" opacity="0.95"/>
    <ellipse cx="60" cy="95" rx="8" ry="14" opacity="0.95"/>
    <ellipse cx="45" cy="90" rx="8" ry="14" transform="rotate(-30,45,90)" opacity="0.95"/>
    <!-- Eye -->
    <circle cx="125" cy="-38" r="8" fill="#FF8000"/>
    <!-- Nostril -->
    <circle cx="155" cy="-15" r="5" fill="#CF2027"/>
    <!-- Jewels (fire balls held by dragon) -->
    <circle cx="-80" cy="-60" r="22" fill="#FFD700" opacity="0.9"/>
    <circle cx="-80" cy="-60" r="14" fill="white" opacity="0.5"/>
    <circle cx="30" cy="90" r="18" fill="#FFD700" opacity="0.9"/>
    <circle cx="30" cy="90" r="11" fill="white" opacity="0.5"/>
  </g>
</svg>
